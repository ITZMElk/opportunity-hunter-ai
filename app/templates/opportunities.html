{% extends "base.html" %}{% block title %}Opportunities · Opportunity Hunter{% endblock %}{% block content %}<section class="section-head"><div><p class="eyebrow">Explore</p><h1>Opportunities</h1></div></section><form class="filters" method="get"><input name="q" value="{{ filters.q }}" placeholder="Search title or organizer"><select name="kind"><option value="">All types</option>{% for type in types %}<option value="{{ type }}" {% if filters.kind == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select><select name="sort"><option value="newest" {% if filters.sort=='newest' %}selected{% endif %}>Newest</option><option value="score" {% if filters.sort=='score' %}selected{% endif %}>Highest score</option><option value="deadline" {% if filters.sort=='deadline' %}selected{% endif %}>Deadline</option></select><label><input type="checkbox" name="recommended" value="true" {% if filters.recommended %}checked{% endif %}> Recommended</label><button>Filter</button></form><section class="cards">{% for opportunity in opportunities %}{% include "card.html" %}{% else %}<p class="empty">No matching opportunities.</p>{% endfor %}</section>{% endblock %}
