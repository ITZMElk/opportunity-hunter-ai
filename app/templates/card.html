<article class="card"><div class="card-top"><span class="pill">{{ opportunity.opportunity_type or 'other' }}</span><strong>{{ '%.0f'|format(opportunity.suitability_score or 0) }}%</strong></div><h3><a href="/opportunity/{{ opportunity.id }}">{{ opportunity.title }}</a></h3><p>{{ opportunity.organizer or 'Unknown organizer' }}</p><p class="muted">Deadline: {{ opportunity.deadline or 'unknown' }} · {{ opportunity.location or 'unknown' }}</p></article>
